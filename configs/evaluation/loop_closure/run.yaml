version: 1
run:
  timezone: Asia/Jerusalem
  seed: 0
  max_parallel: 1
dataset:
  root: evaluation/datasets/euroc
output:
  root: evaluation/output
  queue_capacity: 1024
benchmarks:
  - id: shared_loop_verification_mh01
    command:
      - /opt/loop-detector/ldo-env/bin/python
      - -m
      - loop_eval.benchmarks.loop_verification
      - --config
      - configs/evaluation/loop_closure/config.yaml
    cwd: .
    timeout_seconds: 2700
