version: 1

run:
  timezone: Asia/Jerusalem
  seed: 0
  max_parallel: 1

dataset:
  root: evaluation/datasets/euroc

output:
  root: evaluation/output
  queue_capacity: 1024

# Each entry launches an adapter that speaks the JSON-lines event protocol.
# Native SLAM stdout must be captured by the adapter, not forwarded as events.
# Run the complete pipeline in WSL with: uv run python evaluation/run_wsl.py
benchmarks:
  - id: orb_dbow2_retrieval_mh01
    command:
      - "{python}"
      - -m
      - loop_eval.benchmarks.orb_dbow2
      - --config
      - configs/benchmarks/orb_dbow2/config.yaml
    cwd: .
    timeout_seconds: 900
  - id: ldo_megaloc_lightglue_mh01
    command:
      - /opt/loop-detector/ldo-env/bin/python
      - -m
      - loop_eval.benchmarks.ldo
      - --config
      - configs/benchmarks/ldo/config.yaml
    cwd: .
    # Includes the optional second stereo inference for full-field recovery.
    timeout_seconds: 2700
