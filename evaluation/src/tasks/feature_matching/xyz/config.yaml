version: 8
seed: 0
feature_cache_size: 128
match_ratio: 0.75
minimum_matches: 25
minimum_inliers: 20
minimum_inlier_ratio: 0.40
contradiction_maximum_inlier_ratio: 0.10
ground_truth_error_px: 5.0
homography_error_px: 3.0
pose_timestamp_tolerance_ms: 10
minimum_translation_m: 0.01
maximum_examples_per_outcome: 2
stereo_enabled: true
stereo_pixel_sigma_px: 1.0
stereo_minimum_depth_m: 0.25
stereo_maximum_depth_m: 50.0
stereo_minimum_parallax_degrees: 0.5
stereo_maximum_reprojection_px: 2.0
stereo_maximum_relative_depth_sigma: 0.25
stereo_world_mahalanobis_squared_maximum: 11.345
stereo_cross_reprojection_px: 7.0
# Assumed conservative reference-pose noise, not supplied dataset covariance.
reference_position_sigma_m: 0.03
reference_orientation_sigma_degrees: 1.0
stereo_backend: fast_foundationstereo
stereo_model_python: /opt/loop-detector/fast-stereo-env/bin/python
stereo_model_source: /opt/loop-detector/Fast-FoundationStereo
stereo_model_checkpoint: /opt/loop-detector/Fast-FoundationStereo/weights/nvidia-c-fast/model.onnx
stereo_lr_max_error_px: 1.0
