name: Research repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --locked --extra visualization
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m pytest -q
      - run: uv run ldo-research smoke
      - run: uv run python scripts/check_repository.py
      - name: Check GitHub mathematical preprocessing
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_github_math.py
      - run: uv build
      - run: uv run python scripts/check_wheel.py
