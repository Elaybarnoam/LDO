[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "visual-imu-loop-detector"
version = "0.1.0"
description = "Causal visual loop detection and independent geometric evaluation"
readme = "README.md"
authors = [{ name = "Elay Barnoam" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python; sys_platform == 'win32'",
    "opencv-python-headless; sys_platform != 'win32'",
    "PyYAML",
    "pandas",
    "tzdata",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.9,<4"]
ldo = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "safetensors==0.8.0",
    "huggingface-hub==2.1.1",
    "lightglue @ git+https://github.com/cvg/LightGlue.git@eb42fee2d71449efb0aa5c10549752b5d75384d8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "editables>=0.5,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7"]

[project.scripts]
ldo-research = "loop_eval.cli:main"

[project.urls]
Repository = "https://github.com/Elaybarnoam/LDO"

[tool.hatch.build.targets.wheel]
packages = ["src/ldo", "src/loop_verification", "src/stereo_observations", "src/loop_eval"]
dev-mode-exact = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"configs" = "ldo_research_resources/configs"

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "tests", "evaluation", "scripts", "examples", "docs", "results", "data", "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "CITATION.cff", "pyproject.toml", "uv.lock"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/stereo_observations/stereo_worker.py" = ["I001", "B905"]
"src/loop_eval/tasks/feature_matching/xyz/stereo_worker.py" = ["I001", "B905"]
"src/loop_eval/tasks/feature_matching/xyz/xyz.py" = ["I001", "E701"]

[tool.ruff.format]
exclude = ["src/stereo_observations/stereo_worker.py", "src/loop_eval/tasks/feature_matching/xyz/stereo_worker.py", "src/loop_eval/tasks/feature_matching/xyz/xyz.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "native: requires an external native build",
    "gpu: requires installed models and CUDA",
    "dataset: requires local undistributed experiment evidence",
]

[tool.mypy]
python_version = "3.11"
files = ["src/ldo/contracts.py", "src/loop_eval/paths.py", "src/loop_eval/runtime.py", "src/loop_eval/cli.py"]
follow_imports = "silent"
check_untyped_defs = true

[tool.uv]
package = true
link-mode = "copy"
